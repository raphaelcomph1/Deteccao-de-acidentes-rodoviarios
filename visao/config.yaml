# Configuracao do modulo de visao (Motiva Vision)

detector:
  modelo: modelos/yolo11s.pt   # small: o nano nao detectava o caminhao parado no video de ajuste 01
  tracker: bytetrack.yaml      # ByteTrack embutido no ultralytics
  confianca_minima: 0.30
  tamanho_imagem: 640
  # classes COCO usadas: 0 person, 2 car, 3 motorcycle, 5 bus, 7 truck
  classes:
    0: person
    2: car
    3: motorcycle
    5: bus
    7: truck

saida:
  pasta: saida
  logs: saida/logs
  evidencias: saida/evidencias

# Contrato MQTT v0.2 (docs/contrato_mqtt.md)
mqtt:
  broker: broker.hivemq.com    # plano B: test.mosquitto.org
  porta: 1883
  client_id: motiva-rm563567-visao
  topico_eventos: motiva/rm563567/eventos
  qos: 1

# Classificador (docs/algoritmo_visao.md). Valores provisorios: ajustar so com os videos de AJUSTE.
classificacao:
  limiar_alto: 0.70
  limiar_medio: 0.40
  # pesos das evidencias (cada grupo soma 1.0); cada evidencia vale de 0 a 1
  pesos_colisao:
    contato: 0.15
    desaceleracao: 0.25
    parada: 0.20
    geometria: 0.40           # o tipo depende da geometria: angulo ambiguo nao pode chegar a ALTO
  pesos_atropelamento:        # conservador: a pessoa pesa metade do total, sinal isolado vale pela metade e ha teto
    contato: 0.10
    veiculo_reage: 0.15
    pessoa: 0.50
    geometria: 0.25
  teto_atropelamento: 0.85    # sem video real de atropelamento nao se afirma com certeza maxima
  aproximacao_ref: 1.0        # aproximacao (caixas/s) que vale evidencia de contato 1.0
  desaceleracao_zero: 0.30    # queda relativa de velocidade que vale 0 ...
  desaceleracao_cheia: 0.90   # ... e a que vale 1.0
  parada_ref_s: 1.0           # tempo parado depois do contato que vale 1.0
  pessoa_queda_ref: 0.60      # queda da proporcao altura/largura que vale 1.0
  pessoa_desloc_ref: 3.0      # deslocamento brusco (caixas/s) que vale 1.0
  # geometria, em graus. Traseira: angulo entre direcoes (ou alinhamento) <= pleno vale 1, >= zero vale 0.
  traseira_pleno: 20
  traseira_zero: 45
  alinhamento_traseira_pleno: 30   # veiculo unico em movimento: angulo entre a direcao dele e o vetor ate o outro
  alinhamento_traseira_zero: 60
  alinhamento_tras_dois_pleno: 40  # dois em movimento: pelo menos um vinha de frente para o outro
  alinhamento_tras_dois_zero: 70
  lateral_zero: 30                 # angulo entre direcoes: 0 em lateral_zero, 1 a partir de lateral_pleno ...
  lateral_pleno: 60
  lateral_max_pleno: 120           # ... ate aqui, voltando a 0 em lateral_max_zero (frontal nao e lateral)
  lateral_max_zero: 150
  alinhamento_lateral_zero: 45     # veiculo unico em movimento: aproximacao de lado
  alinhamento_lateral_pleno: 75
  # penalidades (subtraidas do escore, no maximo penalidade_max cada)
  penalidade_max: 0.15
  conf_ref: 0.60              # confianca media das deteccoes abaixo disto comeca a penalizar ...
  conf_min: 0.35              # ... e daqui para baixo penaliza o maximo
  continuidade_ref: 0.80      # fracao de quadros com o track visivel (tracking instavel penaliza abaixo disto)
  continuidade_min: 0.30

# video (sem extensao) -> camera_id e local do evento. Sao so rotulos do evento: a classificacao nunca olha isto.
# Video que nao estiver aqui usa eventos.camera_padrao e eventos.local_padrao.
cameras:
  video_01: {camera_id: CAM01, local: "Rodovia ficticia, km 42 sentido norte"}
  video_02: {camera_id: CAM02, local: "Rodovia ficticia, km 57 sentido sul"}
  video_06: {camera_id: CAM03, local: "Rodovia ficticia, km 63 sentido norte"}

# Trajetorias (features de movimento por track). Nao sao limiares de acidente.
trajetorias:
  janela_suavizacao: 5   # media movel de N quadros (so usa quadros anteriores)
  min_quadros: 10        # tracks mais curtos sao descartados como ruido
  rastro_quadros: 30     # tamanho do rastro desenhado na visualizacao
  escala_vetor_s: 0.5    # o vetor desenhado mostra o deslocamento previsto em N segundos

# Analise temporal (features de pares de tracks). Distancias em "tamanhos de caixa"
# (escala = raiz da area da caixa) e velocidades em tamanhos de caixa por segundo.
# Valores provisorios: ajustar so com os videos de AJUSTE.
analise_temporal:
  contato_gap: 0.10            # contato = distancia entre as caixas <= 10% da menor caixa (0 = sobrepostas)
  contato_quadros_min: 2       # quadros seguidos em contato para valer (evita piscadas do detector)
  liberar_gap: 1.0             # par so pode gerar novo candidato depois de se afastar desta distancia
  janela_pre_s: 1.0            # historico antes do contato usado para velocidade e aproximacao
  pre_min_quadros: 8           # sem historico pre-contato suficiente, nao ha candidato
  velocidade_min_pre: 0.5      # pelo menos um dos tracks precisa estar se movendo (veiculos ja parados nao contam)
  aproximacao_min: 0.3         # velocidade minima de aproximacao entre as caixas antes do contato
  janela_direcao_s: 0.5        # direcao no momento do contato = media do vetor de velocidade neste trecho
  velocidade_min_direcao: 0.3  # abaixo disso a direcao do track nao e confiavel (None)
  janela_decel_s: 1.0          # desaceleracao medida logo apos o contato
  janela_pos_s: 2.0            # observacao total apos o contato (parada, pessoa)
  velocidade_parado: 0.15      # abaixo disso o track conta como parado
  desaceleracao_min: 0.50      # queda relativa minima da velocidade (mediana antes x mediana depois do contato)
  parada_min_s: 0.3            # tempo minimo parado depois do contato (junto com a desaceleracao)
  pessoa_veiculo_reage_min: 0.30   # no par pessoa-veiculo, o veiculo tambem precisa desacelerar ao menos isto
  pessoa_quadros_sumico: 10    # quadros sem aparecer apos o contato = pessoa sumiu do tracking
  pessoa_queda_min: 0.30       # queda minima da proporcao altura/largura da caixa da pessoa
  pessoa_desloc_min: 1.0       # aumento minimo da velocidade da pessoa (caixas/s) para contar como deslocamento brusco

# Eventos (docs/contrato_mqtt.md)
eventos:
  delta_revisao: 0.05      # so reenvia (revisao + 1) se a confianca subir pelo menos isto, ou o tipo/indicador mudar
  janela_dedup_s: 5.0      # contatos de pares que compartilham um track, a menos de N s um do outro, sao o mesmo acidente
  camera_padrao: CAM01
  local_padrao: "Rodovia ficticia, km 42 sentido norte"
